[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "linktrace"
version = "0.1.0"
description = "Async web crawler with rate limiting, robots.txt support, and broken link tracking"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.10",
    "lxml>=5.0",
    "tldextract>=5.0",
    "tenacity>=8.2.3",
    "aiofiles>=23.0",
]

[project.optional-dependencies]
pandas = ["pandas>=2.0"]
polars = ["polars>=1.0"]
pyarrow = ["pyarrow>=14.0"]
serializers = ["pandas>=2.0", "polars>=1.0", "pyarrow>=14.0"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "ruff>=0.15",
    "mypy>=1.14",
    "ipykernel>=7.2.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "tqdm>=4.66",
    "pandas>=2.0",
    "polars>=1.0",
    "pyarrow>=14.0",
]

# Distribution name is "webcrawler"; the import package is "WebCrawler" (the
# subfolder), so point hatchling at it explicitly. data/ lives inside the
# package and ships in the wheel automatically.
[tool.hatch.build.targets.wheel]
packages = ["WebCrawler"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["WebCrawler"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
precision = 2

[tool.coverage.html]
directory = "htmlcov"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_no_return = true